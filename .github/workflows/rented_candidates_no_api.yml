name: Rented Candidates (No API - Free)

on:
  workflow_dispatch:   # تشغيل يدوي -- فلترة نصية فقط، بدون أي استدعاء API، صفر تكلفة

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python rented_candidates_no_api.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rented_candidates_no_api.csv
          git commit -m "Filter rented candidates (no API)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
