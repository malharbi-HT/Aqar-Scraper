name: Track Rent Status (Full Coverage)

on:
  schedule:
    - cron: '7 18 * * 6'   # كل سبت 6:07 مساءً UTC ≈ 9:07 مساءً بتوقيت السعودية
  workflow_dispatch:   # تشغيل يدوي إضافي متاح

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml

      - name: Crawl active rent IDs (district-level)
        run: python crawl_active_ids_rent.py
        continue-on-error: true

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/active_ids_today_rent.csv
          git commit -m "Rent coverage crawl $(date +'%Y-%m-%d')" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
