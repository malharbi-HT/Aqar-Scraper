name: Merge Deals Excel

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- يفك ضغط ويدمج ملفي صفقات وزارة العدل الخام

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl
      - run: python merge_deals_excel.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sale_deals_riyadh_2025_2026.csv
          git commit -m "Merge deals excel files" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
