name: Compute Official Rent Per Sqm

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- يحسب سعر المتر الرسمي من ملف إيجار الخام

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python compute_official_rent_per_sqm.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/official_rent_per_sqm_computed.csv
          git commit -m "Compute official rent per sqm" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
