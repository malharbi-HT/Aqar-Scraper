name: Test Hissatech Properties

on:
  workflow_dispatch:   # تشغيل يدوي -- يختبر عقارات حصتك (يدوية) على النموذج كامل

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python test_hissatech_properties.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hissatech_test_results.csv
          git commit -m "Test Hissatech properties" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
