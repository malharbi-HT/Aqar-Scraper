name: Aqar Phone Extractor

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # GITHUB REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # GOOGLE CLOUD LOGIN
      # ======================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          project_id: hissa-tech-opt
          workload_identity_provider: projects/279042368566/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: hissatech-aqar-agent@hissa-tech-opt.iam.gserviceaccount.com


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # PLAYWRIGHT
      # ======================================================

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium


      # ======================================================
      # RESTORE AQAR LOGGED-IN SESSION
      # ======================================================

      - name: Restore Aqar logged-in session
        env:
          AQAR_STORAGE_STATE: ${{ secrets.AQAR_STORAGE_STATE }}
        run: |
          printf '%s' "$AQAR_STORAGE_STATE" > aqar_storage_state.json


      # ======================================================
      # VERIFY SESSION FILE
      # ======================================================

      - name: Check Aqar session file
        run: |
          if [ -s aqar_storage_state.json ]; then
            echo "Aqar storage state restored successfully."
          else
            echo "ERROR: Aqar storage state is empty."
            exit 1
          fi


      # ======================================================
      # RUN EXTRACTOR
      # ======================================================

      - name: Extract PROCEED Aqar phones
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

          AQAR_STORAGE_STATE_FILE: aqar_storage_state.json

          MIN_DELAY: "4"
          MAX_DELAY: "8"

          PAGE_TIMEOUT: "45000"

        run: |
          python extract_aqar_phones.py
