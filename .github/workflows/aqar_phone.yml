name: Aqar Phone Extractor - Debug 10

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          project_id: hissa-tech-opt
          workload_identity_provider: projects/279042368566/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: hissatech-aqar-agent@hissa-tech-opt.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Restore Aqar session
        env:
          AQAR_STORAGE_STATE: ${{ secrets.AQAR_STORAGE_STATE }}
        run: |
          printf '%s' "$AQAR_STORAGE_STATE" > aqar_storage_state.json

      - name: Verify Aqar session
        run: |
          if [ -s aqar_storage_state.json ]; then
            echo "Aqar session restored."
          else
            echo "ERROR: Aqar session is empty."
            exit 1
          fi

      - name: Test first 10 PROCEED listings
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          AQAR_STORAGE_STATE_FILE: aqar_storage_state.json
          MAX_PROPERTIES_TO_TEST: "10"
          DEBUG_DIR: "debug"
          MIN_DELAY: "3"
          MAX_DELAY: "5"
          PAGE_TIMEOUT: "45000"
        run: |
          python extract_aqar_phones.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqar-debug-10
          path: debug/
          if-no-files-found: warn
