name: Check Missing Districts

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- يحدد الأحياء المفقودة بالكامل من بياناتنا

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python check_missing_districts.py
      - name: Commit missing districts list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/missing_districts.csv
          git commit -m "Update missing districts list" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
