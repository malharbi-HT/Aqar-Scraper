name: Daily Sale Pipeline (Full Auto)

on:
  schedule:
    - cron: '13 18 * * *'   # يوميًا 6:13 مساءً UTC ≈ 9:13 مساءً بتوقيت السعودية
  workflow_dispatch:        # تشغيل يدوي إضافي متاح

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install scikit-learn joblib

      - name: 1. Scrape sale (daily incremental)
        run: python scraper_sale.py
        continue-on-error: true

      - name: 2. Fix area (NLP)
        if: always()
        run: python fix_area_nlp.py
        continue-on-error: true

      - name: 3. Finalize area
        if: always()
        run: python finalize_area.py
        continue-on-error: true

      - name: 4. Fix price (NLP)
        if: always()
        run: python fix_price_nlp.py
        continue-on-error: true

      - name: 5. Cross check area
        if: always()
        run: python cross_check_area.py
        continue-on-error: true

      - name: 6. Detect anomalies
        if: always()
        run: python detect_anomalies.py
        continue-on-error: true

      - name: Commit and push all results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Daily sale pipeline $(date +'%Y-%m-%d')" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
