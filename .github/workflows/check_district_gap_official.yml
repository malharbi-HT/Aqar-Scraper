name: Check District Gap (Official)

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- يقارن العدد الرسمي بصفحة كل حي بعدد ما سحبناه فعليًا

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml pandas
      - run: python check_district_gap_official.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/district_official_vs_actual.csv
          git commit -m "Check district gap vs official site counts" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
