name: Scrape Medina + Jeddah (Parallel by Type + Region)

on:
  schedule:
    - cron: '0 */2 * * *'   # كل ساعتين -- يكمّل الباقي تدريجيًا
  workflow_dispatch:

concurrency:
  group: scrape-medina-jeddah
  cancel-in-progress: false   # ما نلغي الشغّالة، بس نمنع تشغيلة ثانية توازيها

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # المدينة المنورة -- 27 مهمة (9 أنواع × 3 أجزاء أحياء متوازية)
          - city: medina
            property_type: شقق-للبيع
            chunk: "0/3"
          - city: medina
            property_type: شقق-للبيع
            chunk: "1/3"
          - city: medina
            property_type: شقق-للبيع
            chunk: "2/3"
          - city: medina
            property_type: أراضي-للبيع
            chunk: "0/3"
          - city: medina
            property_type: أراضي-للبيع
            chunk: "1/3"
          - city: medina
            property_type: أراضي-للبيع
            chunk: "2/3"
          - city: medina
            property_type: دور-للبيع
            chunk: "0/3"
          - city: medina
            property_type: دور-للبيع
            chunk: "1/3"
          - city: medina
            property_type: دور-للبيع
            chunk: "2/3"
          - city: medina
            property_type: فلل-للبيع
            chunk: "0/3"
          - city: medina
            property_type: فلل-للبيع
            chunk: "1/3"
          - city: medina
            property_type: فلل-للبيع
            chunk: "2/3"
          - city: medina
            property_type: عمائر-للبيع
            chunk: "0/3"
          - city: medina
            property_type: عمائر-للبيع
            chunk: "1/3"
          - city: medina
            property_type: عمائر-للبيع
            chunk: "2/3"
          - city: medina
            property_type: مكاتب-للبيع
            chunk: "0/3"
          - city: medina
            property_type: مكاتب-للبيع
            chunk: "1/3"
          - city: medina
            property_type: مكاتب-للبيع
            chunk: "2/3"
          - city: medina
            property_type: محلات-للبيع
            chunk: "0/3"
          - city: medina
            property_type: محلات-للبيع
            chunk: "1/3"
          - city: medina
            property_type: محلات-للبيع
            chunk: "2/3"
          - city: medina
            property_type: مستودعات-للبيع
            chunk: "0/3"
          - city: medina
            property_type: مستودعات-للبيع
            chunk: "1/3"
          - city: medina
            property_type: مستودعات-للبيع
            chunk: "2/3"
          - city: medina
            property_type: مصانع-للبيع
            chunk: "0/3"
          - city: medina
            property_type: مصانع-للبيع
            chunk: "1/3"
          - city: medina
            property_type: مصانع-للبيع
            chunk: "2/3"
          # جدة -- 18 مهمة (9 أنواع × منطقتين: شمال/جنوب)
          - city: jeddah
            property_type: شقق-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: شقق-للبيع
            region: جنوب-جدة
          - city: jeddah
            property_type: أراضي-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: أراضي-للبيع
            region: جنوب-جدة
          - city: jeddah
            property_type: دور-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: دور-للبيع
            region: جنوب-جدة
          - city: jeddah
            property_type: فلل-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: فلل-للبيع
            region: جنوب-جدة
          - city: jeddah
            property_type: عمائر-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: عمائر-للبيع
            region: جنوب-جدة
          - city: jeddah
            property_type: مكاتب-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: مكاتب-للبيع
            region: جنوب-جدة
          - city: jeddah
            property_type: محلات-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: محلات-للبيع
            region: جنوب-جدة
          - city: jeddah
            property_type: مستودعات-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: مستودعات-للبيع
            region: جنوب-جدة
          - city: jeddah
            property_type: مصانع-للبيع
            region: شمال-جدة
          - city: jeddah
            property_type: مصانع-للبيع
            region: جنوب-جدة
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Scrape ${{ matrix.city }} - ${{ matrix.property_type }} ${{ matrix.region || matrix.chunk }}
        run: python scraper_sale_${{ matrix.city }}.py "${{ matrix.property_type }}" "${{ matrix.region || matrix.chunk }}"
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Scrape ${{ matrix.city }} - ${{ matrix.property_type }} ${{ matrix.region || matrix.chunk }}" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

  merge:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Merge all type files into one per city
        run: |
          python3 << 'PYEOF'
          import pandas as pd
          import glob

          for city in ["medina", "jeddah"]:
              files = glob.glob(f"data/{city}_by_type/listings_{city}_*.csv")
              if not files:
                  print(f"{city}: ما لقينا أي ملفات")
                  continue
              dfs = [pd.read_csv(f, encoding="utf-8-sig") for f in files]
              combined = pd.concat(dfs, ignore_index=True)
              out_path = f"data/listings_sale_{city}_all_types.csv"
              combined.to_csv(out_path, index=False, encoding="utf-8-sig")
              print(f"{city}: دمجنا {len(files)} ملف -> {len(combined)} إعلان -> {out_path}")
          PYEOF
      - name: Commit merged files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/listings_sale_medina_all_types.csv ] && git add data/listings_sale_medina_all_types.csv || echo "ملف المدينة غير موجود بعد"
          [ -f data/listings_sale_jeddah_all_types.csv ] && git add data/listings_sale_jeddah_all_types.csv || echo "ملف جدة غير موجود بعد"
          git commit -m "Merge Medina + Jeddah type files" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
