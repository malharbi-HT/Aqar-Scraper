name: Rent Full Parallel Run

on:
  workflow_dispatch:   # تشغيل يدوي -- يسحب كل المناطق بالتوازي ويدمجهم تلقائيًا بالنهاية

jobs:
  north:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scraper_rent_north.py
        continue-on-error: true
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Rent data - north" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

  east:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scraper_rent_east.py
        continue-on-error: true
      - name: Commit and push
        if: always()
