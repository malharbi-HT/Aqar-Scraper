          git add data/
          git commit -m "Rent data - west" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

  south:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
