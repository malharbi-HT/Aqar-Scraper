name: Explore Stats Page (One-Off)

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- استكشاف بنية صفحة متوسط الأسعار

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python explore_stats_page.py
      - name: Upload dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsc-dump
          path: rsc_dump.txt
