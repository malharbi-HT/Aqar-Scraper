name: Deep Analyze Rented Properties (Top 10)

on:
  workflow_dispatch:   # تشغيل يدوي -- تحليل عميق لأفضل 10 فرص، مقارنة سعر مباشرة من رغدان

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Run deep analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python deep_analyze_rented_property.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deep_analysis_rented_properties.csv
          git commit -m "Deep analyze top 10 rented properties" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
