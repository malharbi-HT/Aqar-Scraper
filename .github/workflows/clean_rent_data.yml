name: Clean Rent Data

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- تنظيف بيانات الإيجار (استبعاد شهري + تصحيح مساحة)

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas

      - name: Clean rent data
        run: python clean_rent_data.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings_rent_master.csv data/listings_rent_clean.csv
          git commit -m "Clean rent data $(date +'%Y-%m-%d')" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
