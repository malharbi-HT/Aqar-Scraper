name: Detect Anomalies (Rent)

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- كشف شذوذ إحصائي ببيانات الإيجار

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas scikit-learn

      - name: Detect anomalies
        run: python detect_anomalies_rent.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings_rent_anomalies.csv data/listings_rent_normal.csv
          git commit -m "Rent anomaly detection $(date +'%Y-%m-%d')" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
