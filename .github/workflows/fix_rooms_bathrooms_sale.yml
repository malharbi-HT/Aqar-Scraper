name: Fix Rooms Bathrooms (Sale)

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- تصحيح عدد الغرف والحمامات من الوصف

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python fix_rooms_bathrooms_sale.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings_sale_rooms_fixed.csv
          git commit -m "Fix rooms/bathrooms (sale)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
