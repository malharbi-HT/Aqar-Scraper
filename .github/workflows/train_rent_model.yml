name: Train Rent Model

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- تدريب نموذج توقع الإيجار

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn joblib

      - name: Train rent model
        run: python train_rent_model.py

      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rent_model.joblib data/rent_model_district_encoding.joblib
          git commit -m "Train rent model $(date +'%Y-%m-%d')" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
