name: Filter Active Only (Rent)

on:
  schedule:
    - cron: '29 0 * * 0'   # كل أحد 12:29 صباحًا UTC ≈ 3:29 فجرًا بتوقيت السعودية (استمرار ليلة السبت)
  workflow_dispatch:   # تشغيل يدوي إضافي متاح

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python filter_active_only_rent.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings_rent_active_only.csv
          git commit -m "Filter active-only rent listings" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
