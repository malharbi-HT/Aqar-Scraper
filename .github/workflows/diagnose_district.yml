name: Diagnose District (One-Off)

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- تشخيص تفصيلي لحي واحد صفحة صفحة

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: python diagnose_district.py
