name: Merge Final Report

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- يدمج تقرير العائد وتقرير مقارنة الصفقات بملف نهائي واحد

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python merge_final_report.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/final_combined_report.csv
          git commit -m "Merge final combined report" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
