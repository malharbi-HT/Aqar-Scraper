name: Scrape Eastern Province (Parallel by City + Type + Chunk)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-eastern
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        city: [dammam, khobar, dhahran, jubail, ahsa, qatif]
        property_type:
          - شقق-للبيع
          - أراضي-للبيع
          - دور-للبيع
          - فلل-للبيع
          - عمائر-للبيع
          - مكاتب-للبيع
          - محلات-للبيع
          - مستودعات-للبيع
          - مصانع-للبيع
        chunk: ["0/2", "1/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Scrape ${{ matrix.city }} - ${{ matrix.property_type }} ${{ matrix.chunk }}
        run: python scraper_sale_eastern.py "${{ matrix.city }}" "${{ matrix.property_type }}" "${{ matrix.chunk }}"
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Scrape ${{ matrix.city }} - ${{ matrix.property_type }} ${{ matrix.chunk }}" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

  merge:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Merge all type files into one per city
        run: |
          python3 << 'PYEOF'
          import pandas as pd
          import glob

          cities = ["dammam", "khobar", "dhahran", "jubail", "ahsa", "qatif"]
          for city in cities:
              files = glob.glob(f"data/{city}_by_type/listings_{city}_*.csv")
              if not files:
                  print(f"{city}: ما لقينا أي ملفات")
                  continue
              dfs = [pd.read_csv(f, encoding="utf-8-sig") for f in files]
              combined = pd.concat(dfs, ignore_index=True)

              full_images_path = f"data/{city}_by_type/images_full_{city}.csv"
              if "images" in combined.columns:
                  combined[["listing_id", "images"]].to_csv(full_images_path, index=False, encoding="utf-8-sig")
                  combined["images"] = combined["images"].apply(
                      lambda v: str(v).split(" | ")[0] if pd.notna(v) else v
                  )

              out_path = f"data/listings_sale_{city}_all_types.csv"
              combined.to_csv(out_path, index=False, encoding="utf-8-sig")
              print(f"{city}: دمجنا {len(files)} ملف -> {len(combined)} إعلان -> {out_path}")
          PYEOF
      - name: Commit merged files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for city in dammam khobar dhahran jubail ahsa qatif; do
            [ -f "data/listings_sale_${city}_all_types.csv" ] && git add "data/listings_sale_${city}_all_types.csv" || echo "$city: ملف غير موجود"
          done
          git commit -m "Merge Eastern Province type files" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
