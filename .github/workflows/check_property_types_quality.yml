name: Check Property Types Quality

on:
  workflow_dispatch:   # تشغيل يدوي -- فحص جودة شامل لكل الأنواع الخمسة الجديدة

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python check_property_types_quality.py
