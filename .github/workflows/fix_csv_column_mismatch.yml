name: Fix CSV Column Mismatch (One-Off)

on:
  workflow_dispatch:   # تشغيل يدوي فقط -- إصلاح مرة وحدة لتعارض عدد الأعمدة

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python fix_csv_column_mismatch.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings_sale.csv
          git commit -m "Fix CSV column mismatch" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
