name: Rented Medina + Jeddah (No API - Free)

on:
  workflow_dispatch:   # تشغيل يدوي -- نفس بايبلاين استخراج المؤجّرة حق الرياض، مطبّق على المدينة وجدة

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas scikit-learn
      - run: python detect_anomalies_city_no_api.py medina
      - run: python detect_anomalies_city_no_api.py jeddah
      - run: python rented_by_city_no_api.py medina
      - run: python rented_by_city_no_api.py jeddah
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Detect anomalies + extract rented Medina + Jeddah (no API)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
