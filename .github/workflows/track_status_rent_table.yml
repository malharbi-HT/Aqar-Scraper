name: Track Status Rent - Table

on:
  schedule:
    - cron: '11 0 * * 0'   # كل أحد 12:11 صباحًا UTC ≈ 3:11 فجرًا بتوقيت السعودية (استمرار ليلة السبت، بعد المسح الثقيل بـ6 ساعات)
  workflow_dispatch:   # تشغيل يدوي إضافي متاح

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python track_status_rent.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings_rent_status.csv
          git commit -m "Update rent status table" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
