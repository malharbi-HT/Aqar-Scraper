name: Property Types Scraper (Parallel)

on:
  workflow_dispatch:   # تشغيل يدوي -- يسحب الخمسة أنواع (فلل/أدوار/أراضي/عمائر/مكاتب) بالتوازي

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # لو نوع فشل، الباقي يكمل عادي
      matrix:
        property_type:
          - { script: scraper_villa.py,    name: villa }
          - { script: scraper_floor.py,    name: floor }
          - { script: scraper_land.py,     name: land }
          - { script: scraper_building.py, name: building }
          - { script: scraper_office.py,   name: office }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: python ${{ matrix.property_type.script }}
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings_${{ matrix.property_type.name }}.csv
          git commit -m "Scrape ${{ matrix.property_type.name }} listings" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
